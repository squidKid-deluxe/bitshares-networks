<!DOCTYPE html>
<html>
    <head>
        <link href="main.css" rel="stylesheet">
        <script type="text/javascript" src="tabs.js"></script>
        <title>Bitshares Networks</title>
        <link rel="icon" type="image/x-icon" href="./images/bitshares.png">
    </head>
    <body>
        <div class="tab" style="position:relative;flex: 1;display: flex; width: 100%;">
            <button class="tablinks" onclick="switch_tab(event, '1')">Pools</button>
            <button class="tablinks" onclick="switch_tab(event, '2')">Home</button>
            <button class="tablinks" onclick="switch_tab(event, '3')">Explorer</button>
            <button class="tablinks" onclick="switch_tab(event, '4')">Market Cap</button>
            <button class="tablinks" onclick="switch_tab(event, '5')">Links</button>
            <button class="tablinks" onclick="switch_tab(event, '6')">Team</button>
            <button class="tablinks" onclick="switch_tab(event, '7')">Nodes</button>
        </div>
        <div class="tabcontent" style="display:block;">
            <center>
                <img src="./images/hollow_bitshares.png" height="100%" style="margin-top:10vh;overflow:hidden">
            </center>
        </div>
        <object id="1" class="tabcontent" type="text/html" data-src="liquidity_pools.html"></object>
        <object id="2" class="tabcontent" type="text/html" data-src="https://bitshares.github.io/"></object>
        <object id="3" class="tabcontent" type="text/html" data-src="https://btslens.pages.dev/dashboard"></object>
        <object id="4" class="tabcontent" type="text/html" data-src="marketcap.html"></object>
        <object id="5" class="tabcontent" type="text/html" data-src="awesome.html"></object>
        <object id="6" class="tabcontent" type="text/html" data-src="https://bitsharesgroup.org/"></object>
        <div id="7" class="tabcontent wrapper nodes">
            <object type="text/html" data-src="nodes.html" style="width:inherit;height:10vh; grid-column:3; grid-row:1"></object>
            <object type="text/html" data-src="places.html" style="height:80vh;width:20vw; grid-column:1; grid-row:2"></object>
            <img src="images/map.gif" style="width:57vw; grid-column:1; grid-row:2;top: -20vh;position:relative;"></img>
            <object type="text/html" data-src="servers.html" style="height:80vh;width:20vw; grid-column:1; grid-row:2"></object>
        </div>
    </body>
</html>
