name: Update & Publish

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and accumulate images from gh-pages
        run: |
          git fetch origin gh-pages:gh-pages || true
          mkdir -p .old_gh_pages
          git --work-tree=.old_gh_pages checkout gh-pages -- . || true
          mkdir -p pools/images
          if [ -d .old_gh_pages/pools/images ]; then
            cp -rn .old_gh_pages/pools/images/* pools/images/ 2>/dev/null || true
          fi
          rm -rf .old_gh_pages

      - name: Run pool mapper, latency test, and scraper
        run: cd pools; python3 main.py; cd ..

      - name: Commit and force-push to GitHub Pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git commit -m "Update via workflow" || echo "No changes to commit"
          git push --force-with-lease origin HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
