name: Update & Publish

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and accumulate data from gh-pages
        run: |
          if git fetch origin gh-pages:gh-pages 2>/dev/null; then
            mkdir -p .old_gh_pages
            git archive gh-pages | tar -x -C .old_gh_pages
            mkdir -p pools/website/images pools/latency_maps
            # Restore images
            if [ -d .old_gh_pages/images ]; then
              cp -rn .old_gh_pages/images/* pools/website/images/ 2>/dev/null || true
            fi
            # Restore latency_maps, flattening any nested directories
            if [ -d .old_gh_pages/latency_maps ]; then
              find .old_gh_pages/latency_maps -name "map_*.png" -exec cp {} pools/latency_maps/ \; 2>/dev/null || true
            fi
            rm -rf .old_gh_pages
          else
            echo "gh-pages branch does not exist yet, skipping fetch"
          fi

      - name: Run pool mapper, latency test, and scraper
        run: cd pools; python3 main.py; cd ..

      - name: Deploy to GitHub Pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions[bot]"
          mkdir -p /tmp/gh-pages-deploy/website
          mkdir -p /tmp/gh-pages-deploy/latency_maps
          cp -r pools/website/* /tmp/gh-pages-deploy/website/ 2>/dev/null || true
          cp -r pools/latency_maps/* /tmp/gh-pages-deploy/latency_maps/ 2>/dev/null || true
          git checkout --orphan gh-pages-new
          git rm -rf . 2>/dev/null || true
          rm -rf pools/ images/ latency_maps/ 2>/dev/null || true
          cp -r /tmp/gh-pages-deploy/* . 2>/dev/null || true
          git add .
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force-with-lease origin gh-pages-new:gh-pages
          git checkout main
          git branch -D gh-pages-new
          rm -rf /tmp/gh-pages-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
